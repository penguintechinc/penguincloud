    get:
      description: '

        Now reachable by delegated admins as well as direct members, which is

        precisely why the rows go through TenantMemberResponse: get_tenant_members

        returns raw joined rows, so a wider audience on the endpoint would have

        meant a wider audience for every column that join happens to carry.'
      operationId: get_list_tenant_members
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  count:
                    title: Count
                    type: integer
                  members:
                    items:
                      $ref: '#/components/schemas/TenantMemberResponse'
                    maxItems: 10000
                    title: Members
                    type: array
                required:
                  - members
