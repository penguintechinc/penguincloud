                title: TenantMemberListResponse
                type: object
          description: Envelope for a tenant's membership list.
      summary: List tenant members.
    post:
      description: ''
      operationId: post_add_tenant_member_endpoint
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: number
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  id:
                    title: Id
                    type: integer
                  invited_by_id:
                    anyOf:
                      - type: integer
                      - type: 'null'
                    title: Invited By Id
                  joined_at:
                    anyOf:
                      - type: string
                      - type: 'null'
                    title: Joined At
                  role:
                    title: Role
                    type: string
                  tenant_id:
                    title: Tenant Id
                    type: integer
                  user_email:
                    anyOf:
                      - type: string
                      - type: 'null'
                    title: User Email
                  user_full_name:
                    anyOf:
                      - type: string
                      - type: 'null'
                    title: User Full Name
                  user_id:
                    title: User Id
                    type: integer
                required:
                  - id
                  - tenant_id
                  - user_id
                  - role
                  - invited_by_id
                  - joined_at
                  - user_email
                  - user_full_name
                title: TenantMemberResponse
                type: object
          description: 'A tenant membership row plus the member''s contact identity.


            PII policy (deliberate, not incidental): ``user_email`` and

            ``user_full_name`` ARE included, because administering a tenant means

            administering its member accounts and an MSP admin cannot do that

            against opaque user ids. NO other column from the users table is

            exposed here — not role, not is_active, not timestamps, not

            password_hash — and this DTO is the only path membership data takes to a

            response body. Adding a column to `users` must not widen this.


            Field set is reconciled with the webui''s TenantMember interface

            (services/webui/src/client/types/index.ts).'
