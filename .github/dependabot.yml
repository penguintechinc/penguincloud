version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/services/mobile"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/services/portal-api"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
