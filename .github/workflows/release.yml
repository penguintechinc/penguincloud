name: Publish Docker image on release

permissions:
  contents: read

on:
  release:
    types: [published]

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

# See ci.yml's identical block for why: unspecified shell is `bash -e {0}`
# (no pipefail), which can silently swallow a failed left-hand command in
# any `cmd | other` pipeline. No such pipe exists in this file today, but
# setting this workflow-wide means one added later doesn't quietly
# reintroduce that failure mode.
defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Reject anything that isn't a real vMAJOR.MINOR.PATCH tag
        # devops.md's tag format for tagged releases is
        # v{Major}.{Minor}.{Patch}, nothing else. Without this check, a
        # release published under a stray/mistaken tag -- "latest",
        # "v1.2", a typo -- would publish straight through to
        # portal-api:<that literal string>, including a genuinely
        # dangerous case: a release tagged "latest" would publish
        # portal-api:latest, a floating tag devops-containers.md's table
        # does not define for this product and this workflow has no
        # business ever producing.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not v{Major}.{Minor}.{Patch}"
            echo "::error::(devops.md CI/CD Tag Naming) -- refusing to publish."
            exit 1
          fi

  build-platform:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        service: [portal-api, webui]
        include:
          # See push.yml for why context differs per service: portal-api's
          # Dockerfile COPYs a bare `requirements.txt`, so the context must
          # be the service directory or the build silently picks up the
          # stale root requirements.txt instead.
          - service: portal-api
            context: services/portal-api
            dockerfile: services/portal-api/Dockerfile
          - service: webui
            context: .
            dockerfile: services/webui/Dockerfile
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
          SERVICE: ${{ matrix.service }}
        run: |
          ARCH=$(printf '%s\n' "$PLATFORM" | sed 's|/|-|g')
          IMAGE="ghcr.io/${{ github.repository }}/${SERVICE}"
          BUILD_TAG="${IMAGE}:${RELEASE_TAG}-${ARCH}"
          printf '%s\n' "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.version.outputs.build_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }},mode=max

  merge-manifests:
    name: Merge manifests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-platform
    strategy:
      fail-fast: false
      matrix:
        service: [portal-api, webui]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge version manifests
        env:
          VERSION: ${{ github.event.release.tag_name }}
          SERVICE: ${{ matrix.service }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${SERVICE}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
