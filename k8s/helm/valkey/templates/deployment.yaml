{{/*
Auth is mandatory (no anonymous Valkey access) and both containers below
reference the Secret unconditionally via secretKeyRef — fail loudly at
render time rather than shipping a Deployment that will CreateContainer-
ConfigError because the Secret does not exist.
*/}}
{{- if not (or .Values.secrets.create .Values.externalSecrets.enabled) }}
{{- fail "valkey: neither secrets.create nor externalSecrets.enabled is true — VALKEY_PASSWORD has no source. Set one (alpha convenience: secrets.create + --set secrets.data.VALKEY_PASSWORD=...; beta/gamma/prod: externalSecrets)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valkey.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # A rolling update would leave the OLD and NEW pod both bound briefly,
    # but this is a single-instance cache with no leader election —
    # Recreate avoids two valkey-server processes racing to write /data.
    type: Recreate
  selector:
    matchLabels:
      {{- include "valkey.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "valkey.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "valkey.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Renders the ACL file that scopes the "default" user (the only
        # identity penguin_dal's AsyncValkeyCache can authenticate as — see
        # values.yaml acl comment) to acl.keyPattern/acl.commands, with the
        # password read from the Secret via env var and written ONLY to an
        # ephemeral, pod-local emptyDir — never baked into the ConfigMap or
        # any committed file (security.md "Secrets & Credentials").
        - name: render-acl
          image: >-
            {{ .Values.image.repository }}@{{ .Values.image.digest }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/usr/bin/sh", "-c"]
          args:
            - |
              set -e
              umask 077
              printf 'user default on >%s ~%s %s\n' "$VALKEY_PASSWORD" "{{ .Values.acl.keyPattern }}" "{{ .Values.acl.commands }}" > /etc/valkey-runtime/users.acl
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "valkey.secretName" . }}
                  key: VALKEY_PASSWORD
          resources:
            {{- toYaml .Values.initContainerResources | nindent 12 }}
          volumeMounts:
            - name: acl-runtime
              mountPath: /etc/valkey-runtime
      containers:
        - name: valkey
          image: >-
            {{ .Values.image.repository }}@{{ .Values.image.digest }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Default ENTRYPOINT (docker-entrypoint.sh) preserved -- it execs
          # `valkey-server "$@"` once running as non-root (see
          # values.yaml tracingPolicy comment for the verified exec chain).
          args:
            - valkey-server
            - /etc/valkey/valkey.conf
            - --aclfile
            - /etc/valkey-runtime/users.acl
          ports:
            - name: valkey
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "valkey.secretName" . }}
                  key: VALKEY_PASSWORD
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            - name: acl-runtime
              mountPath: /etc/valkey-runtime
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "valkey.configMapName" . }}
        - name: acl-runtime
          emptyDir:
            sizeLimit: 1Mi
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "valkey.pvcName" . }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ index .Values.resources.limits "ephemeral-storage" | default "128Mi" }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
