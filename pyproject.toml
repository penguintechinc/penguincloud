[tool.ruff]
target-version = "py313"     # py312 only while migrating
line-length = 100            # matches Prettier printWidth + dart format

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest expresses every assertion with `assert`, so bandit's S101 ("assert
# detected") flags every test in the repo — 373 findings across the suite,
# none of them a defect. S101 exists because `python -O` strips asserts from
# PRODUCTION code; a test runner never runs under -O, and rewriting pytest
# assertions to satisfy it would make the suite worse, not safer.
#
# Without this, `ruff` fails on any commit that stages a test file, so no
# test in this repo could be changed at all. The repo already draws exactly
# this boundary for the same class of rule: the bandit hook is invoked as
# `-ll -r` over the app tree, never over tests.
#
# Deliberately narrow — one rule, one tree. Everything else in `select`
# still applies to tests.
#
# Discovered while adding Task 6's tests: ruff only just landed in
# pre-commit (staged-files-only, see .pre-commit-config.yaml), so this had
# never been surfaced against the existing suite before a Task 6 test file
# was the first to be staged post-migration.
#
# S105/S107 (hardcoded-password string / default arg) joined S101 here
# during the Phase 5 merge for the same reason: bandit's password/token
# heuristics pattern-match variable and parameter NAMES
# (password/secret/token/...), not values, and every test fixture in this
# repo that registers or logs in a user needs a `password=` literal or
# parameter to do it. Three call sites (test_products.py, test_scope_
# enforcement.py) had picked up inline `# noqa: S105`/`# noqa: S107`
# instead of landing here, which left the codebase disagreeing with
# itself -- identical fixture patterns in untouched files were still
# unsuppressed findings waiting to surface the next time ruff touched
# them. Consolidated to this one rule, one tree, stated once.
"tests/**" = ["S101", "S105", "S107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
