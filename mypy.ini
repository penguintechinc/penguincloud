[mypy]
# Enforce strict mode globally; per-module overrides below selectively relax
# for legacy modules during incremental typing migration (Phase 1a). By moving
# strict from CLI flag to config, per-module ratchet sections can override it.
strict = True

# Pre-commit runs `mypy --ignore-missing-imports` (not --strict). Without
# follow_imports=silent, mypy also fully type-checks every module a staged
# file transitively imports (e.g. any file in services/flask-backend/app/
# pulls in the whole package via app/__init__.py), which surfaces hundreds
# of pre-existing, unrelated findings across untouched files on every
# commit. This is the standard mypy-recommended setting for incrementally
# adopting --strict in an existing codebase:
# https://mypy.readthedocs.io/en/stable/existing_code.html
# Staged files themselves are still fully strict-checked (unless ratcheted below).
follow_imports = silent

# LEGACY-TYPING-RATCHET: remove when this module is migrated to typed Quart code (Phase 1a)
[mypy-app.auth]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_any_generics = False
disallow_any_unimported = False
disallow_any_expr = False
disallow_untyped_calls = False
no_implicit_optional = False
warn_return_any = False
warn_no_return = False

