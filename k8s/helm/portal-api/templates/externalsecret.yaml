{{/*
External Secrets Operator integration (security.md — preferred over the
convenience Secret above for beta/gamma/prod). Requires the ESO CRDs and a
SecretStore/ClusterSecretStore already configured in-cluster; this chart
only declares the ExternalSecret that pulls into the same Secret name the
Deployment already references, so enabling this vs. secrets.create is a
drop-in swap with no other template change.
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "portal-api.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portal-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "portal-api.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $localKey, $remoteKey := .Values.externalSecrets.keys }}
    - secretKey: {{ $localKey }}
      remoteRef:
        key: {{ $remoteKey }}
    {{- end }}
{{- end }}
{{/*
Dedicated JWT keystore ExternalSecret — see values.yaml
persistence.jwtKeystore comment for why this is a separate object, never
merged into the map above (never envFrom'd). Unlike valkey's ACL secret,
this needs no "reject an empty value" template trick: FileKeyStore's
_load() feeds the mounted file straight into json.loads(), so an empty
Vault value produces an immediate JSONDecodeError and a loud
CrashLoopBackOff at startup, not a silently-working-but-insecure state —
already fail-closed by construction.
*/}}
{{- if and .Values.externalSecrets.enabled .Values.persistence.jwtKeystore.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "portal-api.jwtKeystoreSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portal-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "portal-api.jwtKeystoreSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.persistence.jwtKeystore.fileName }}
      remoteRef:
        key: {{ .Values.persistence.jwtKeystore.externalSecretKey }}
{{- end }}
