{{/*
Convenience Secret for alpha/local use ONLY — populate the real password
via `--set secrets.data.VALKEY_PASSWORD=value` (never commit it). Composes
BOTH the bare password (for the liveness probe's REDISCLI_AUTH env var) and
the fully-rendered users.acl line (for templates/deployment.yaml's
projected secret-file mount) at HELM RENDER TIME, since this path has the
plaintext value available to template with — no shell substitution at pod
startup needed. Fails rendering if the password is empty: a guard that
only checks a source EXISTS (secrets.create is true) does not catch a
vanilla `helm install -f alpha.yml` shipping an empty password, since
alpha.yml never overrides values.yaml's empty secrets.data.VALKEY_PASSWORD
default.
*/}}
{{- if .Values.secrets.create }}
{{- if not .Values.secrets.data.VALKEY_PASSWORD }}
{{- fail "valkey: secrets.create is true but secrets.data.VALKEY_PASSWORD is empty — pass --set secrets.data.VALKEY_PASSWORD=<value> at install time (alpha convenience only; never commit a real password to a values file)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "valkey.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
type: Opaque
stringData:
  VALKEY_PASSWORD: {{ .Values.secrets.data.VALKEY_PASSWORD | quote }}
  users.acl: {{ printf "user default on >%s ~%s %s\n" .Values.secrets.data.VALKEY_PASSWORD .Values.acl.keyPattern .Values.acl.commands | quote }}
{{- end }}
