# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image on push

permissions:
  contents: read

on:
  push:
    branches: ['main']
env:
  REPO: insert-repo-name-here
jobs:
  build-platform:
    name: Build Docker image for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Ansible Lint
        run: |
          pip install ansible-lint
          ansible-lint

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6
        with:
          images: |
            ghcr.io/${{ github.repository }}

      - name: Determine build tag
        id: tag
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          ARCH=$(printf '%s\n' "$PLATFORM" | sed 's|/|-|g')
          BUILD_TAG="ghcr.io/${{ github.repository }}:beta-$(date +%s)-${ARCH}"
          printf '%s\n' "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tag.outputs.build_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

  merge-manifests:
    name: Merge manifests
    runs-on: ubuntu-latest
    needs: build-platform
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        env:
          REPO_ENV: ${{ env.REPO }}
        run: |
          EPOCH=$(date +%s)
          BETA_TAG="ghcr.io/${{ github.repository }}:beta-${EPOCH}"
          ALPHA_TAG="ghcr.io/${{ github.repository }}:alpha-${EPOCH}"
          DOCKER_BETA_TAG="penguincloud/${REPO_ENV}:beta-${EPOCH}"
          DOCKER_ALPHA_TAG="penguincloud/${REPO_ENV}:alpha-${EPOCH}"
          printf '%s\n' "beta_tag=${BETA_TAG}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "alpha_tag=${ALPHA_TAG}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "docker_beta_tag=${DOCKER_BETA_TAG}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "docker_alpha_tag=${DOCKER_ALPHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Merge manifests (beta tags)
        env:
          BETA_TAG: ${{ steps.tags.outputs.beta_tag }}
          DOCKER_BETA_TAG: ${{ steps.tags.outputs.docker_beta_tag }}
          REPO_PATH: ${{ github.repository }}
        run: |
          EPOCH=$(date +%s)
          docker buildx imagetools create \
            -t "$BETA_TAG" \
            -t "$DOCKER_BETA_TAG" \
            "ghcr.io/${REPO_PATH}:beta-${EPOCH}-amd64" \
            "ghcr.io/${REPO_PATH}:beta-${EPOCH}-arm64"
