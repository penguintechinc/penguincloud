warn_no_return = False

# LEGACY-TYPING-RATCHET: remove when this module is migrated to typed Quart code (Phase 1a)
# strict_optional additionally relaxed here (unlike app.auth/app.models above):
# teams.py route handlers take typed path params (team_id: int), which makes
# mypy fully type-check their bodies regardless of check_untyped_defs (that
# flag only skips bodies of *fully* unannotated defs) — surfacing pre-existing
# `Optional[dict] is not indexable` findings on every get_current_user() call
# site (auth_required guarantees non-None at runtime; mypy can't see that).
[mypy-app.teams]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_any_generics = False
disallow_any_unimported = False
disallow_any_expr = False
disallow_untyped_calls = False
no_implicit_optional = False
warn_return_any = False
warn_no_return = False
strict_optional = False

# Test module ratchet sections below are keyed on the BARE filename
# (test_x), not tests.api.test_x. Neither tests/ nor tests/api/ has an
# __init__.py, so mypy resolves each test file as a top-level module named
# after the file alone (verified via `mypy --verbose`: "module='test_audit'",
# base_dir walks up only as far as the nearest ancestor with no
# __init__.py — tests/api/ itself in this case). A `tests.api.test_x`
# section name never matches and is silently a no-op.

# LEGACY-TYPING-RATCHET: remove when this module is migrated to typed Quart code (Phase 1a)
# warn_unused_ignores disabled: this file's per-line `# type: ignore
# [no-untyped-def]` comments predate the module-name fix above (they were
# load-bearing when the section name was the dead `tests.api.test_x` form
# and this ratchet never actually applied) — now redundant with the
# section itself, but removing ~10 inline comments is out of scope for a
# section-name correctness fix.
[mypy-test_auth_extended]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_any_generics = False
disallow_any_unimported = False
disallow_any_expr = False
disallow_untyped_calls = False
no_implicit_optional = False
warn_return_any = False
warn_no_return = False
warn_unused_ignores = False

