[mypy]
# Pre-commit runs `mypy --strict` on staged files only. Without
# follow_imports=silent, mypy also fully type-checks every module a staged
# file transitively imports (e.g. any file in services/flask-backend/app/
# pulls in the whole package via app/__init__.py), which surfaces hundreds
# of pre-existing, unrelated findings across untouched files on every
# commit. This is the standard mypy-recommended setting for incrementally
# adopting --strict in an existing codebase:
# https://mypy.readthedocs.io/en/stable/existing_code.html
# Staged files themselves are still fully strict-checked.
follow_imports = silent
