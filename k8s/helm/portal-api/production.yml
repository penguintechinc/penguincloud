# portal-api — production overrides. Base values.yaml is already the prod
# resource/security baseline; this file layers only what genuinely differs
# per real deployment: the digest-pinned image, the public hostname, the
# actual purchased license tier, and the shared JWT keystore volume that
# replicaCount > 1 requires.
#
# OPERATOR: license.tier and replicaCount must match the actual purchased
# licence before deploy — the deployment.yaml guard fails rendering if
# replicaCount exceeds that tier's backend-node cap (docs/APP_STANDARDS.md).

replicaCount: 3

image:
  repository: ghcr.io/penguintechinc/penguincloud/portal-api
  tag: ""  # digest below takes precedence
  # REQUIRED — sha256:<digest> of the released image (pinning-dependency-digests
  # skill). Rendering fails until set — see requireDigest below.
  digest: ""
  pullPolicy: IfNotPresent
  requireDigest: true

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# values.yaml defaults license.tier to "community" (secure by default) —
# this file is the ONLY place that opts up to a higher tier, and it is
# REQUIRED to be here: with replicaCount: 3 / autoscaling.maxReplicas: 10
# above, an unedited "community" or "professional" tier fails the
# deployment.yaml backend-node-cap guard by design. OPERATOR: set this to
# the deployment's ACTUAL purchased tier before deploy, never blindly copy
# "enterprise" — a lower tier without matching replica counts is exactly
# the failure this guard exists to force you to resolve consciously.
license:
  tier: enterprise

service:
  type: ClusterIP

ingress:
  enabled: true
  className: cilium
  host: ""  # REQUIRED — the product's real domain (penguintech.md Product Domains) or PenguinCloud-hosted default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts: []
      secretName: portal-api-tls

# REQUIRED at replicaCount > 1 — every replica reads the SAME pre-populated,
# read-only keystore Secret (values.yaml persistence.jwtKeystore comment).
# OPERATOR: see templates/NOTES.txt "First deploy: JWT keystore bootstrap"
# — the key must be generated out-of-band and stored at this Vault path
# BEFORE the first deploy; nothing in this chart or the app generates it.
persistence:
  jwtKeystore:
    enabled: true
    externalSecretKey: penguincloud/production/portal-api-jwt-keystore#keystore.json

config:
  BASE_URL: ""  # REQUIRED — matches ingress.host
  LOG_LEVEL: warn
  RELEASE_MODE: "true"
  DB_HOST: postgres
  DB_POOL_SIZE: "20"
  JWT_ISSUER: ""  # REQUIRED — https://<BASE_URL>
  CORS_ORIGINS: ""  # REQUIRED — https://<webui BASE_URL>

secrets:
  create: false

externalSecrets:
  enabled: true
  secretStoreRef:
    name: penguincloud-vault
    kind: ClusterSecretStore
  keys:
    SECRET_KEY: penguincloud/production/portal-api#SECRET_KEY
    DB_PASS: penguincloud/production/portal-api#DB_PASS
    ENCRYPTION_KEY: penguincloud/production/portal-api#ENCRYPTION_KEY
    LICENSE_KEY: penguincloud/production/portal-api#LICENSE_KEY
    # Same Vault path valkey/production.yml's ExternalSecret uses for
    # VALKEY_PASSWORD — deliberately the SAME key, not a portal-api-scoped
    # copy, so the two can never drift out of sync.
    CACHE_PASS: penguincloud/production/valkey#VALKEY_PASSWORD
    KILLKRILL_CLIENT_ID: penguincloud/production/portal-api#KILLKRILL_CLIENT_ID
    KILLKRILL_CLIENT_SECRET: penguincloud/production/portal-api#KILLKRILL_CLIENT_SECRET
    OAUTH_GOOGLE_CLIENT_ID: penguincloud/production/portal-api#OAUTH_GOOGLE_CLIENT_ID
    OAUTH_GOOGLE_CLIENT_SECRET: penguincloud/production/portal-api#OAUTH_GOOGLE_CLIENT_SECRET

networkPolicy:
  enabled: true
  extraIngress:
    - namespaceLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
      ports:
        - port: "8000"
          protocol: TCP

podSecurityAdmission:
  manageNamespace: true
  namespace: penguincloud
  enforce: restricted

metrics:
  serviceMonitor:
    enabled: false  # flip once Prometheus Operator CRDs are confirmed installed

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Spread replicas across nodes so a single node loss can't take down enough
# pods to threaten the PDB's minAvailable.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: portal-api
              app.kubernetes.io/instance: portal-api
