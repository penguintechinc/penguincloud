{{/*
Static config only — no secrets. The users.acl file is a pre-composed
Secret key projected directly as a read-only file (templates/secret.yaml +
externalsecret.yaml + deployment.yaml) — never through this ConfigMap, and
never assembled at pod startup at all (no init container, no shell — see
values.yaml persistence.jwtKeystore-style comment in templates/
deployment.yaml). --aclfile is supplied via the main container's args, not
this file, since it names a path this ConfigMap does not own.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valkey.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
data:
  valkey.conf: |
    bind 0.0.0.0
    port {{ .Values.service.port }}
    protected-mode yes
    dir /data
    # Pure cache duty — see values.yaml persistence comment.
    save ""
    appendonly no
    maxmemory {{ .Values.maxmemory }}
    maxmemory-policy {{ .Values.maxmemoryPolicy }}
