{{/*
Convenience Secret for alpha/local use ONLY — populate real values via
`--set secrets.data.KEY=value` (never commit them to a values file). Beta/
gamma/prod should set secrets.create: false and externalSecrets.enabled:
true instead (security.md "Secrets & Credentials": Vault / Sealed Secrets /
External Secrets Operator, never hardcoded).
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portal-api.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portal-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{/*
Dedicated JWT keystore Secret — see values.yaml persistence.jwtKeystore
comment for why this is a separate object, never merged into the map
above. A source existing (secrets.create: true) is not the same as the
VALUE being non-empty (the same class of gap I4 fixed for valkey) — only
checked when jwtKeystore.enabled; alpha/beta/gamma leave both
persistence.jwtKeystore.json and .enabled unset/false together, which is
correct, not an oversight this guard should catch.
*/}}
{{- if and .Values.secrets.create .Values.persistence.jwtKeystore.enabled }}
{{- if not .Values.persistence.jwtKeystore.json }}
{{- fail "portal-api: persistence.jwtKeystore.enabled is true and secrets.create is true, but persistence.jwtKeystore.json is empty. Generate a keystore file out-of-band (see templates/NOTES.txt 'First deploy: JWT keystore bootstrap') and pass its content with --set-file persistence.jwtKeystore.json=<path> (never bare --set — it is multi-line JSON), or disable persistence.jwtKeystore for a single-replica install." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portal-api.jwtKeystoreSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portal-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.persistence.jwtKeystore.fileName }}: {{ .Values.persistence.jwtKeystore.json | quote }}
{{- end }}
