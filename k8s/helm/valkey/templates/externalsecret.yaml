{{/*
External Secrets Operator integration (security.md), preferred for beta/
gamma/prod over the convenience Secret above.

Uses target.template.data to compose BOTH VALKEY_PASSWORD (verbatim, for
the liveness probe's REDISCLI_AUTH env var) and users.acl (the fully
rendered ACL line for templates/deployment.yaml's projected secret-file
mount) from the SAME single Vault-sourced password — the ESO controller
evaluates the template server-side at reconcile time, so Vault only ever
stores the bare password once (never a pre-composed, duplicated ACL
blob that could drift from it) and no shell inside this chart's pods ever
substitutes a secret value.

`{{`{{ .VALKEY_PASSWORD }}`}}` below is a Helm raw-string action
(back-ticked literal) that prints the LITERAL text `{{ .VALKEY_PASSWORD }}`
into the rendered manifest — that placeholder belongs to ESO's own
Go-template engine, evaluated later against the fetched secret data, not
to Helm at chart-render time. .Values.acl.keyPattern/.Values.acl.commands
ARE real Helm values and interpolate normally at render time.
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "valkey.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "valkey.secretName" . }}
    creationPolicy: Owner
    template:
      data:
        VALKEY_PASSWORD: "{{`{{ .VALKEY_PASSWORD }}`}}"
        users.acl: "user default on >{{`{{ .VALKEY_PASSWORD }}`}} ~{{ .Values.acl.keyPattern }} {{ .Values.acl.commands }}\n"
  data:
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.keys.VALKEY_PASSWORD }}
{{- end }}
