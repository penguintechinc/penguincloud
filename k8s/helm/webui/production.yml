# webui — production overrides. Base values.yaml is already the prod
# resource/security baseline; layer only what genuinely differs.
#
# OPERATOR: license.tier and replicaCount must match the actual purchased
# licence — the deployment.yaml guard fails rendering if replicaCount
# exceeds that tier's backend-node cap (docs/APP_STANDARDS.md).

replicaCount: 3

image:
  repository: ghcr.io/penguintechinc/penguincloud/webui
  tag: ""
  digest: ""  # REQUIRED — sha256:<digest>; rendering fails until set (requireDigest below)
  pullPolicy: IfNotPresent
  requireDigest: true

resources:
  requests:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
    ephemeral-storage: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# See k8s/helm/portal-api/production.yml's identical comment — this file
# is the only place that opts up from the secure-by-default "community"
# base; an unedited "enterprise" here does not excuse the operator from
# confirming it matches the actual purchased tier before deploy.
license:
  tier: enterprise

service:
  type: ClusterIP

ingress:
  enabled: true
  className: cilium
  host: ""  # REQUIRED — the product's real domain (penguintech.md Product Domains)
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - hosts: []
      secretName: webui-tls

config:
  NODE_ENV: production
  PORT: "3000"
  FLASK_API_URL: http://portal-api:8000

networkPolicy:
  enabled: true
  extraIngress:
    - namespaceLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
      ports:
        - port: "3000"
          protocol: TCP

podSecurityAdmission:
  manageNamespace: false
  namespace: penguincloud
  enforce: restricted

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: webui
              app.kubernetes.io/instance: webui
