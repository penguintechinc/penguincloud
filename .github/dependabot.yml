version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/services/mobile"
      - "/services/portal-api"
      - "/services/webui"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "gradle"
    directories:
      - "/services/mobile/android"
      - "/services/mobile/android/app"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/services/webui"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/services/cli"
      - "/services/portal-api"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "pub"
    directory: "/services/mobile"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
