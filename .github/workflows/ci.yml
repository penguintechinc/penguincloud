# CI: lint, security, test, and build-verify gate. Runs on every PR and on
# pushes to main/release branches so a post-merge commit is validated too.
# This is the workflow that actually runs the test suites -- push.yml/
# release.yml/cron.yml only publish images and never executed a test.

name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/v*.x'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Unspecified shell on Linux runners is `bash -e {0}` -- NOT pipefail.
# `false | tee out.log` exits 0 under that default (tee's own exit code
# wins), which made `--cov-fail-under=78` below decorative: coverage could
# fall to 0% and the piped step would still report green. Explicit
# `shell: bash` resolves to `bash --noprofile --norc -eo pipefail {0}`,
# which does propagate the left side of a pipe. Set once, workflow-wide,
# rather than per-step, so a pipe added later doesn't quietly reintroduce
# this.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (pre-commit + OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        # frontend-react.md's floor is 24.x, 26.x preferred; services/
        # webui/Dockerfile now runs on node:26-bookworm-slim, so this
        # matches the image instead of trailing it.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # zizmor: ignore[cache-poisoning] false positive
        with:
          node-version: '26'

      - name: Install webui dependencies
        # eslint-webui/prettier-webui hooks below shell out via
        # `npx --no-install`, so node_modules must already exist.
        run: npm ci
        working-directory: services/webui

      - name: Set up Python
        # Makefile:584's venv-portal-api target shells out to `python3.13`
        # by name -- GitHub-hosted ubuntu-latest runners don't ship that
        # binary pre-installed, so without this step `make venv-portal-api`
        # below fails immediately with "python3.13 not installed" (see the
        # security job's identical step, the only job that already had it).
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'

      - name: Create the isolated portal-api venv
        # Also provides the exact pinned mypy (2.3.0) the local mypy hook
        # below runs against -- see .pre-commit-config.yaml's mypy hook
        # comment: it is a `language: system` hook that uses whatever
        # `mypy` is first on PATH, not an isolated pre-commit env.
        #
        # Deliberately uncached: actions/cache and setup-node's built-in
        # cache both trip zizmor's cache-poisoning audit on a workflow that
        # also runs on pull_request (a cache written by an untrusted fork
        # PR run can be restored by a later trusted run on the base
        # branch). This workflow is new -- there is no prior cached state
        # to protect, so the simplest fix is not caching at all rather than
        # trying to hand-roll a fork-safe restore-only/save-only split.
        # Revisit if CI wall-clock time becomes a real cost.
        run: make venv-portal-api

      - name: Install pre-commit into the venv
        # Pinned version: 4.6.1 is the exact version .pre-commit-config.yaml's
        # own header comment was validated against (stage-default behaviour
        # differs across versions).
        run: .venv/bin/pip install pre-commit==4.6.1

      - name: pre-commit (pre-commit stage -- fast checks)
        # zizmor (GitHub Actions workflow scanner) is one of these hooks --
        # `language: system`, so it needs to be on PATH. Installed here
        # rather than as a separate step since nothing else in this job
        # needs it standalone.
        run: |
          .venv/bin/pip install zizmor==1.25.2
          export PATH="$PWD/.venv/bin:$PATH"
          pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure

      - name: Lint OpenAPI spec (spectral)
        run: make openapi-lint

  security:
    name: Security scans (pre-push tier)
    runs-on: ubuntu-latest
    # .pre-commit-config.yaml's entire pre-push tier -- bandit, semgrep,
    # trivy-fs, trivy-config, osv-scanner, checkov, k8s-security-scan,
    # pip-audit, npm-audit-webui, trufflehog, dockerfile-rootless -- has
    # `stages: [pre-push]` and NEVER ran in CI (the lint job above only
    # invokes `--hook-stage pre-commit`). That left dependency-vulnerability
    # and SAST enforcement resting entirely on a developer's local hooks
    # being installed and not stubbed -- both have already happened in this
    # session. This job runs the same tier on every PR instead of trusting
    # that.
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        # Needed for the npm-audit-webui hook (`npm audit`).
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # zizmor: ignore[cache-poisoning] false positive
        with:
          node-version: '26'

      - name: Install webui dependencies
        run: npm ci
        working-directory: services/webui

      - name: Install pre-commit and the system-language pre-push tools
        # bandit and semgrep are repo-hosted hooks -- pre-commit manages
        # their isolated envs itself from .pre-commit-config.yaml's pinned
        # revs, no extra install here. The rest are `language: system`
        # hooks that need a binary already on PATH:
        #   - trivy: pinned to v0.69.3, security.md's stated cap for this
        #     tool (never the newest release without raising the cap).
        #   - osv-scanner, trufflehog, kube-score: no org-stated cap, pinned
        #     to latest stable as of this writing. kube-score was missing
        #     from this list entirely -- scripts/hooks/run-k8s-checks.sh's
        #     k8s-security-scan hook (`language: system`, same as the
        #     others here) shelled out to a `kube-score` binary this job
        #     never installed, so the hook failed "command not found" on
        #     every chart/env combination the first time this pre-push
        #     tier actually ran in CI (it never had before this workflow).
        #   - checkov, pip-audit: pip-installable, exact versions.
        run: |
          pip install --no-cache-dir pre-commit==4.6.1 checkov==3.3.13 pip-audit==2.10.1

          curl -fsSL -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm -f /tmp/trivy.tar.gz

          curl -fsSL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner

          curl -fsSL -o /tmp/trufflehog.tar.gz \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz
          tar -xzf /tmp/trufflehog.tar.gz -C /usr/local/bin trufflehog
          rm -f /tmp/trufflehog.tar.gz

          curl -fsSL -o /usr/local/bin/kube-score \
            https://github.com/zegl/kube-score/releases/download/v1.20.0/kube-score_1.20.0_linux_amd64
          chmod +x /usr/local/bin/kube-score

          trivy --version
          osv-scanner --version
          trufflehog --version
          kube-score version
          checkov --version
          pip-audit --version
        env:
          # apt/sudo not needed for any of the above -- all install to
          # /usr/local/bin, which is already writable and on PATH for the
          # runner user on GitHub-hosted ubuntu-latest images.
          DEBIAN_FRONTEND: noninteractive

      - name: pre-commit (pre-push stage -- security tier)
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

  test-backend:
    name: Backend tests (isolated venv)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Python
        # Makefile:584's venv-portal-api target shells out to `python3.13`
        # by name -- GitHub-hosted ubuntu-latest runners don't ship that
        # binary pre-installed, so without this step `make venv-portal-api`
        # below fails immediately with "python3.13 not installed" (see the
        # security job's identical step, the only job that already had it).
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'

      - name: Create the isolated portal-api venv
        # Deliberately uncached -- see the lint job's equivalent step for
        # why (zizmor cache-poisoning on a pull_request-triggered workflow).
        run: make venv-portal-api

      - name: Fail if the committed OpenAPI spec is stale
        run: make openapi-check

      - name: Run portal-api test suite (isolated venv, declared/pinned deps only)
        # `make venv-portal-api && make test-api` is the ONLY way a fresh
        # checkout reproduces local results instead of depending on
        # whatever is globally installed on the runner -- see
        # docs/DEVELOPMENT.md "Isolated test venv".
        run: make test-api

      - name: Backend coverage gate
        # A second, coverage-instrumented invocation of the same suite
        # (pytest-cov measures via execution, there is no way to derive
        # coverage from the run above without re-running). `-rs` prints
        # skip reasons so a skip is visible in the log rather than buried
        # behind a green summary line -- see the job summary step below
        # for why that matters here specifically.
        #
        # The `| tee` here now genuinely gates thanks to the workflow-level
        # `defaults.run.shell: bash` above (pipefail) -- verified by
        # deliberately breaking the threshold locally and watching this
        # exact command fail. Without it, a failing coverage run (or a
        # failing test unique to this instrumented invocation) would report
        # green because tee's own exit code, not pytest's, decided the
        # step's outcome.
        #
        # This repo's coverage floor was a TEMPORARY REGRESSION FLOOR of 78%
        # (see git history: this comment previously explained that 78% was
        # measured, not aspirational, and that 90% was tracked follow-up
        # work) -- that follow-up work landed in the same change that raised
        # this number to 90%. testing-python.md's org-wide standard is 90%;
        # this is now that standard, not a temporary marker, verified
        # locally at exactly 90% (7107 statements, 696 missed) with 0 test
        # failures. pyproject.toml's `[tool.coverage.report] fail_under =
        # 90` mirrors this so a local `pytest --cov=app` enforces the same
        # floor without repeating the flag; the CLI flag below is still
        # authoritative in CI. Do not lower this number.
        #
        # `--cov-branch` was added here (json report only) because
        # coverage.py blends lines+branches into ONE "Cover%" once
        # branch=True -- leaving `--cov-fail-under=90` on the CLI with
        # `--cov-branch` on would silently redefine what "90%" means
        # (measured locally: blended 88.24%, below the line-only 91.00%
        # this repo has actually earned) instead of adding a second,
        # independent dimension. critical-rules.md's Coverage section
        # requires lines, branches, functions and statements -- Python's
        # coverage.py has no native "function" concept (that's a
        # jest/istanbul dimension, see jest.config.js's
        # coverageThreshold), and statement coverage IS line coverage for
        # this tool, so the two enforceable Python dimensions are
        # line/statement (gated below at 90, unchanged) and branch (gated
        # below, separately).
        #
        # `--cov-fail-under=0` below is NOT "no gate" -- it is required to
        # stop coverage.py falling back to pyproject.toml's `[tool.coverage.
        # report] fail_under = 90`, which still applies to whatever this
        # run measures (the blended 88.24%) whenever no CLI flag is given.
        # Discovered the hard way: the first version of this step omitted
        # the flag entirely, assuming that meant "no pytest-cov-level
        # enforcement here, scripts/check-coverage-dimensions.py is the
        # sole gate" -- pytest-cov printed "FAIL Required test coverage of
        # 90.0% not reached. Total coverage: 88.23%" and exited 1 anyway,
        # gating the exact blended metric this comment says not to use.
        # scripts/check-coverage-dimensions.py (below) is the real gate for
        # both dimensions now.
        #
        # Branch floor is 77, not 90: measured locally at exactly 77.54%
        # (1450/1870 branches, 1787 passed/22 skipped/18 xfailed/0 failed --
        # unchanged from the line-only run above, confirming --cov-branch
        # only adds measurement, it does not change what runs). This repo
        # has never gated branch coverage before -- 77 is a measured floor,
        # not an aspiration, using the exact same reasoning that set the
        # line gate to 78 before 90 was earned (see the paragraph above).
        # Known, evidenced path to raising it: ~27 `if not user: return 401`
        # branches in app/teams.py and app/products.py (0/12 and 0/12
        # pragma'd) plus one straggler in app/tenants.py (12/13 pragma'd)
        # are structurally unreachable -- middleware.py's auth_required is
        # the ONLY place in the entire app that assigns `g.current_user`
        # (grep confirms), and it always sets it to a truthy, active user
        # before calling the wrapped view, on every success path, with
        # every failure path returning before reaching the view. app/
        # discovery.py, app/dashboard_api.py and 12/13 of app/tenants.py's
        # occurrences already carry `# pragma: no cover - auth_required
        # guarantees a user` for this exact reason; app/teams.py, app/
        # products.py, app/audit.py (0/2) and that one app/tenants.py
        # straggler do not yet. Excluding them (not this job's file scope --
        # see the coverage-audit task) would mechanically raise measured
        # branch coverage from 77.54% to roughly 78.68% (1450/1843) without
        # a single new test, since they are proven dead, not merely
        # untested.
        run: |
          .venv/bin/python -m pytest tests/ -q -rs \
            --cov=app --cov-branch \
            --cov-report=xml:coverage-backend.xml \
            --cov-report=json:coverage-backend.json \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            | tee pytest-backend.log

          .venv/bin/python scripts/check-coverage-dimensions.py \
            coverage-backend.json --min-lines 90 --min-branches 77

      - name: Surface skipped tests in the job summary
        # Known gap: TestAgainstLiveNest (tests/api/test_nest_adapter.py)
        # needs Nest's own dependency set (opentelemetry, kubernetes, a
        # real Nest checkout) that this job deliberately does not install
        # -- see test-product-source below, which does. Without this step
        # those skips are invisible inside a green pytest summary line;
        # this repo's whole reason for existing this run is not letting
        # that happen silently.
        if: always()
        run: |
          {
            echo '## Backend test summary'
            echo
            echo '```'
            grep -E '^(SKIPPED|[0-9]+ (passed|failed|skipped|xfailed|error))' pytest-backend.log || true
            echo '```'
            skip_count=$(grep -c '^SKIPPED' pytest-backend.log || true)
            echo
            echo "${skip_count:-0} test(s) skipped in this job -- product-source-dependent"
            echo "skips are expected here and covered separately by the"
            echo "test-product-source job (REQUIRE_PRODUCT_SOURCE=1)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: always()
        with:
          name: coverage-backend
          path: coverage-backend.xml
          retention-days: 14

  test-webui:
    name: WebUI tests (jest, 90% threshold per jest.config.js)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # zizmor: ignore[cache-poisoning] false positive
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci
        working-directory: services/webui

      - name: Type-check
        run: npm run typecheck
        working-directory: services/webui

      - name: Jest (coverage gate enforced via jest.config.js coverageThreshold)
        run: npm run test:coverage
        working-directory: services/webui

  test-product-source:
    name: Backend tests against real Gough/Nest/Tobogganing checkouts
    runs-on: ubuntu-latest
    # Not required-to-pass (yet): this job currently and correctly fails --
    # see the comments on the "Run tests/api..." step below. It surfaces a
    # real, pre-existing gap (a stale Tobogganing fixture) that no CI ever
    # ran before, rather than a defect this workflow introduced.
    # continue-on-error keeps it visibly red on every PR without blocking
    # the merge gate for unrelated changes until that gap is actually
    # closed.
    continue-on-error: true
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          path: penguincloud

      # gough, nest and tobogganing are all public penguintechinc repos, so
      # no cross-repo token is needed. All three, not just gough+nest: the
      # product-source guards below all key off the SAME
      # REQUIRE_PRODUCT_SOURCE=1 flag (tests/api/product_source_fixtures.py
      # source_required()), and test_tobogganing_source_fixture.py uses the
      # identical fail-loud-instead-of-skip pattern -- checking out only
      # two of the three would make this job fail on a fixture-freshness
      # check that has nothing to do with what it was added for.
      - name: Check out Gough
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          repository: penguintechinc/gough
          persist-credentials: false
          path: product-source/gough

      - name: Check out Nest
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          repository: penguintechinc/nest
          persist-credentials: false
          path: product-source/nest

      - name: Check out Tobogganing
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          repository: penguintechinc/tobogganing
          persist-credentials: false
          path: product-source/tobogganing

      - name: Set up Python
        # Makefile:584's venv-portal-api target shells out to `python3.13`
        # by name -- GitHub-hosted ubuntu-latest runners don't ship that
        # binary pre-installed, so without this step `make venv-portal-api`
        # below fails immediately with "python3.13 not installed" (see the
        # security job's identical step, the only job that already had it).
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'

      - name: Create the isolated portal-api venv
        # Deliberately uncached -- see the lint job's equivalent step for
        # why (zizmor cache-poisoning on a pull_request-triggered workflow).
        working-directory: penguincloud
        run: make venv-portal-api

      - name: Install the extra packages the live product boots need
        # Verified by actually running this job's command locally against
        # real checkouts before landing it, iterating until each
        # ModuleNotFoundError was resolved with the product's OWN pin:
        #
        # - TestAgainstLiveNest executes Nest's real Quart app, which
        #   transitively imports `kubernetes` (apps/api/handlers/
        #   import_handler.py) and the full opentelemetry SDK, not just the
        #   API package (apps/api/telemetry.py: `opentelemetry.sdk.*`).
        #   None of these are dependencies of this portal. Nest pins its
        #   full dependency set exactly (apps/api/requirements.txt), but
        #   several of those pins collide with the portal's own -- e.g.
        #   quart==0.20.0 vs this repo's quart==0.21.0,
        #   prometheus-client==0.21.1 vs 0.26.0 -- so installing Nest's
        #   whole requirements.txt into this venv would silently downgrade
        #   packages this suite is pinned against. These four are not
        #   already pinned anywhere in this repo, so they are additions
        #   that cannot conflict; everything else TestAgainstLiveNest
        #   imports (aiohttp, cryptography, prometheus-client, quart,
        #   pyjwt) is already present, just at a different exact version
        #   than Nest's own lock.
        #
        # - Tobogganing's fixture-freshness tests actually BOOT hub_api
        #   (tests/api/tobogganing_route_source.py boot_failure()) rather
        #   than AST-parsing it. hub_api/cache/client.py imports `redis`,
        #   but hub_api/requirements.txt does not declare it at all -- an
        #   upstream gap in a repo this workflow cannot edit (READ-ONLY).
        #   Pinned here to the version tobogganing's OWN netsvcs-dns engine
        #   uses elsewhere in the same monorepo (closest available signal
        #   to an authoritative pin, not a real one -- there isn't one).
        #
        # Once hub_api actually boots, TestFixtureFreshness and the SASE
        # allowlist tests correctly FAIL: Tobogganing's live route table now
        # has a `/api/v1/sase/blockpages/*` + `/api/v1/sase/swg/*` surface
        # that tests/api/fixtures/tobogganing_source.json does not. That is
        # this job finding a real, pre-existing gap (the vendored fixture
        # predates those routes) exactly as designed -- not a defect in this
        # workflow. See PR description; fixing it is `make
        # refresh-product-source-fixtures` plus review, which is a fixture
        # content decision outside .github/workflows/'s scope.
        working-directory: penguincloud
        run: .venv/bin/pip install opentelemetry-api==1.44.0 opentelemetry-sdk==1.44.0 kubernetes==31.0.0 redis==5.0.1

      - name: Run tests/api with product-source guards required (no silent skips)
        # Expected to currently fail -- see the step above and the PR
        # description. Left as a real, non-green check rather than muted:
        # a red check that says exactly what is stale is the point of this
        # job. This is not (yet) wired into a required/blocking status; the
        # backend gate that blocks merges is test-backend, above.
        #
        # `-rfE`, not `-rf`: pytest's short-summary reporting is opt-in per
        # category once you pass -r at all, and `f` alone reports FAILED
        # lines but silently DROPS `ERROR ` lines -- verified locally (a
        # fixture that raises during setup shows in the summary with no -r
        # flag or with `-rfE`, but vanishes with `-rf` alone). Collection/
        # fixture-setup errors are exactly the missing-upstream-dependency
        # shape this job exists to catch (e.g. TestAgainstLiveNest before
        # the step above installed kubernetes/opentelemetry): with `-rf`,
        # `grep -c '^ERROR '` below would have been structurally always 0,
        # silently emptying that half of the attribution step.
        working-directory: penguincloud
        env:
          REQUIRE_PRODUCT_SOURCE: '1'
          GOUGH_SOURCE_ROOT: ${{ github.workspace }}/product-source/gough
          NEST_SOURCE_ROOT: ${{ github.workspace }}/product-source/nest
          TOBOGGANING_SOURCE_ROOT: ${{ github.workspace }}/product-source/tobogganing
        run: .venv/bin/python -m pytest tests/api -q -rfE | tee pytest-product-source.log

      - name: Attribute failures -- known product surface vs. unclassified
        # Regex-matching a file name cannot reliably tell "our vendored
        # fixture is stale" apart from "the other repo's own dependency
        # hygiene is broken" -- both manifest through the SAME test files
        # (TestAgainstLiveNest's errors were a missing `kubernetes` import
        # inside Nest's own code, not a bug in anything this repo vendors).
        #
        # The previous version of this step treated anything that didn't
        # match a narrow Tobogganing-only pattern as "upstream, not ours"
        # by default -- which silently mislabelled real, in-repo problems
        # (a stale gough/nest fixture, an allowlist drift) as someone
        # else's job, and combined with continue-on-error that is WORSE
        # than no attribution at all: a genuine regression both fails to
        # block the merge gate and is explicitly pointed away from the
        # person who should act on it.
        #
        # There is no "upstream" bucket anymore. Every gough/nest/
        # tobogganing fixture, allowlist, or adapter test failure is
        # KNOWN PRODUCT SURFACE and gets reviewed here first, regardless of
        # whether the eventual root cause turns out to be this repo's
        # fixture or the other repo's dependency hygiene. Anything that
        # doesn't match one of those known files is UNCLASSIFIED and
        # flagged for triage, never silently attributed to someone else.
        if: always()
        run: |
          # Allowlist across all three products' fixture/allowlist/adapter
          # test files. gough has no "source_fixture" file (its equivalent
          # is route_drift, see tests/api/gough_route_source.py); nest and
          # tobogganing use source_fixture instead.
          KNOWN='tests/api/test_(gough_(adapter|allowlist|route_drift)|nest_(adapter|allowlist|source_fixture)|tobogganing_(adapter|allowlist|source_fixture))\.py'
          {
            echo '## Product-source test summary'
            echo
            failed=$(grep -c '^FAILED ' penguincloud/pytest-product-source.log || true)
            errored=$(grep -c '^ERROR ' penguincloud/pytest-product-source.log || true)
            echo "${failed:-0} failed, ${errored:-0} errored."
            echo
            echo '### KNOWN PRODUCT SURFACE -- review here first'
            echo "Gough/Nest/Tobogganing fixture, allowlist, and adapter tests."
            echo "The cause could be a stale vendored fixture in this repo"
            echo '(tests/api/fixtures/*.json -- refresh with'
            echo '"make refresh-product-source-fixtures") or a dependency/'
            echo "behaviour issue in the upstream product itself -- this list"
            echo "does not distinguish the two, it only narrows where to"
            echo "start reading:"
            echo '```'
            grep -E "^(FAILED|ERROR) ${KNOWN}" penguincloud/pytest-product-source.log \
              || echo '(none)'
            echo '```'
            echo
            echo '### UNCLASSIFIED -- triage required'
            echo "Failed or errored outside the known product-test files above."
            echo "Never assume this is someone else's problem -- read it."
            echo '```'
            grep -E '^(FAILED|ERROR)' penguincloud/pytest-product-source.log \
              | grep -vE "${KNOWN}" || echo '(none)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build-verify:
    name: Docker build verify (${{ matrix.service }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        service: [portal-api, webui]
        include:
          - service: portal-api
            context: services/portal-api
            dockerfile: services/portal-api/Dockerfile
          - service: webui
            context: .
            dockerfile: services/webui/Dockerfile
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        # Needed for the linux/arm64 leg on an amd64 runner. Without this,
        # an arm64-only Dockerfile break would merge green here and only
        # fail push.yml's real build-platform job after merge -- and since
        # merge-manifests needs that job, no image would publish at all for
        # that push, which is the worst version of "found out too late".
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Build (no push) -- catches a broken Dockerfile before merge
        # No cache-from/cache-to here. This workflow runs on pull_request,
        # and a GHA cache scoped to a same-repo PR branch can be written by
        # that PR and restored by a later trusted run on the base branch --
        # exactly the cache-poisoning shape the lint/test-backend/
        # test-product-source jobs above already removed actions/cache for.
        # Uncached costs more wall-clock time per PR; that is an accepted
        # trade against a real poisoning vector, the same call already made
        # for those jobs.
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: ${{ matrix.platform }}
