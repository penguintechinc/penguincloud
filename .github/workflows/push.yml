# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image on push

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'release/v*.x'

concurrency:
  group: publish-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tag prefix and epoch are resolved ONCE here and passed to every other
  # job via outputs. The previous version of this workflow called
  # `date +%s` independently in build-platform (per matrix leg) AND again
  # in merge-manifests -- three different processes computing three
  # different timestamps, so imagetools was merging tags that were never
  # actually pushed. See devops.md CI/CD Tag Naming for the beta/gamma
  # mapping: release branches -> beta, main -> gamma.
  prepare:
    name: Resolve build tag
    runs-on: ubuntu-latest
    outputs:
      epoch: ${{ steps.vars.outputs.epoch }}
      tag_prefix: ${{ steps.vars.outputs.tag_prefix }}
    steps:
      - name: Resolve epoch + tag prefix
        id: vars
        env:
          # Never interpolate ${{ }} directly into a run: script (zizmor
          # template-injection) -- route it through env: and reference the
          # shell variable instead, even for a value as low-risk as a
          # branch name.
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "$REF_NAME" = "main" ]; then
            echo "tag_prefix=gamma" >> "$GITHUB_OUTPUT"
          else
            echo "tag_prefix=beta" >> "$GITHUB_OUTPUT"
          fi

  build-platform:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        service: [portal-api, webui]
        include:
          # portal-api's Dockerfile does `COPY requirements.txt .` with a
          # bare filename -- the build context is what decides which
          # requirements.txt that resolves to. Context MUST be the service
          # directory itself so it can only ever resolve to
          # services/portal-api/requirements.txt, never the stale root one.
          - service: portal-api
            context: services/portal-api
            dockerfile: services/portal-api/Dockerfile
          # webui's Dockerfile COPYs `./services/webui/...` and
          # `./shared/react_libs` relative to the repo root, so its context
          # must stay the root.
          - service: webui
            context: .
            dockerfile: services/webui/Dockerfile
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build tag
        id: tag
        env:
          PLATFORM: ${{ matrix.platform }}
          SERVICE: ${{ matrix.service }}
          TAG_PREFIX: ${{ needs.prepare.outputs.tag_prefix }}
          EPOCH: ${{ needs.prepare.outputs.epoch }}
        run: |
          ARCH=$(printf '%s\n' "$PLATFORM" | sed 's|/|-|g')
          # Per-service image name (devops-containers.md):
          # ghcr.io/{org}/{repo}/{service} -- NOT one shared image for the
          # whole product.
          IMAGE="ghcr.io/${{ github.repository }}/${SERVICE}"
          BUILD_TAG="${IMAGE}:${TAG_PREFIX}-${EPOCH}-${ARCH}"
          printf '%s\n' "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tag.outputs.build_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }},mode=max

  merge-manifests:
    name: Merge manifests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [prepare, build-platform]
    strategy:
      matrix:
        service: [portal-api, webui]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge manifests
        env:
          SERVICE: ${{ matrix.service }}
          TAG_PREFIX: ${{ needs.prepare.outputs.tag_prefix }}
          EPOCH: ${{ needs.prepare.outputs.epoch }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${SERVICE}"
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG_PREFIX}-${EPOCH}" \
            "${IMAGE}:${TAG_PREFIX}-${EPOCH}-amd64" \
            "${IMAGE}:${TAG_PREFIX}-${EPOCH}-arm64"
