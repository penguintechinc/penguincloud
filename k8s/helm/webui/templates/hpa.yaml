{{- if .Values.autoscaling.enabled }}
{{/*
See portal-api's identical guard/comment: an unset maxReplicas silently
collapses effectiveReplicas to replicaCount (defeating the backend-node-cap
guard) and renders an HPA with no maxReplicas field at all.
*/}}
{{- $maxReplicas := required "autoscaling.maxReplicas must be set when autoscaling.enabled is true (a missing value renders an HPA with no maxReplicas field, invalid at apply, and silently defeats the backend-node-cap guard in templates/deployment.yaml, which reads it as 0)." .Values.autoscaling.maxReplicas }}
{{- if gt (int .Values.autoscaling.minReplicas) (int $maxReplicas) }}
{{- fail (printf "webui: autoscaling.minReplicas (%d) > autoscaling.maxReplicas (%d) — the Kubernetes API server rejects this HPA spec outright; helm template/lint do not catch it." (int .Values.autoscaling.minReplicas) (int $maxReplicas)) }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "webui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webui.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "webui.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ $maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
