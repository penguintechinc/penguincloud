[mypy]
# Strict mode, enforced globally, with no per-module relaxations.
#
# Phase 1a removed every legacy typing override the Flask->Quart migration
# had accumulated. Do not reintroduce a per-module section that disables
# type checking or weakens strict for a file; the whole tree type-checks as
# written. If a third-party library's own stubs genuinely force a
# suppression, use a narrow, single-line, coded and commented suppression at
# the offending line instead of a config-level exemption.
strict = True

# `make lint` runs `mypy .` over the repo root. mypy does NOT honour
# .gitignore, so without this it descends into non-Python trees and
# locally generated artifacts, either crashing or reporting findings on
# files that are not ours -- two agents this migration tripped on Flutter
# iOS `ephemeral/` helper scripts under services/mobile (a Dart project
# with no Python at all). Every first-party Python module still checks.
#
# services/cli (the pcli client) is excluded for the analogous reason one
# level down: it IS Python, but it is a separate, independently-versioned
# package with its own pyproject.toml/venv/pinned deps (services/cli/
# requirements.txt), none of which this root .venv (portal-api's own,
# built by `make venv-portal-api`) installs -- e.g. `keyring`, which pcli
# depends on and portal-api never will. Checking pcli's source through a
# venv that lacks its dependencies degrades every third-party symbol to
# Any and then trips `disallow_subclassing_any` for reasons that have
# nothing to do with pcli's own code (see tests/conftest.py's
# InMemoryKeyring, which subclasses keyring.backend.KeyringBackend).
# pcli's own strict gate is `make cli-lint`
# (services/cli/pyproject.toml's own [tool.ruff]/mypy invocation, against
# services/cli/.venv where keyring genuinely resolves) -- verified clean
# there; this exclude only stops the SHARED hook from mis-checking it
# through the wrong environment, it does not weaken checking of pcli
# itself.
exclude = (^services/mobile/|^services/cli/|/\.venv/|/node_modules/|/build/|/\.dart_tool/|/ephemeral/|/__pycache__/)

# tests/ import the backend as a top-level `app` package (tests/conftest.py
# puts services/portal-api on sys.path at runtime). Without this, mypy
# cannot resolve `from app.middleware import ...` when checking tests/, and
# --ignore-missing-imports silently degrades those symbols to Any -- which
# hides real errors rather than surfacing them.
mypy_path = services/portal-api

# Pre-commit runs mypy (without --strict) on staged files only. Without
# follow_imports=silent, mypy also fully type-checks every module a staged
# file transitively imports -- any file under services/portal-api/app/
# pulls in the whole package via app/__init__.py -- surfacing findings in
# untouched files on every commit. This is mypy's documented setting for
# incremental adoption in an existing codebase:
# https://mypy.readthedocs.io/en/stable/existing_code.html
#
# Nothing is hidden by it: staged files are still fully checked, and the
# acceptance run passes every app module explicitly:
#   mypy --strict --ignore-missing-imports services/portal-api/app
follow_imports = silent

# Third-party dependency without inline type information. PyYAML ships no
# py.typed; its stubs live in the separate `types-PyYAML` distribution
# (declared in services/portal-api/requirements.in), which is not
# installable in every environment -- a PEP 668 externally-managed
# interpreter refuses it outright. This setting concerns that library's
# imports only: it does not relax checking of any first-party module, and is
# not a per-module exemption for our own code. Anything read out of `yaml`
# is annotated at the call site, so the values are still checked.
#
# Replaces the identical section that existed for `requests`, which Task 3
# removed from the service entirely (see app/adapters/transport.py -- httpx
# is now the only HTTP client). Left in place it would have been a standing
# exemption for a library nothing imports.
[mypy-yaml]
ignore_missing_imports = True
