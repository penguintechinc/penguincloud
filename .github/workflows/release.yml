name: Publish Docker image on release

permissions:
  contents: read

on:
  release:
    types: [published]
env:
  REPO: insert-repo-name-here
jobs:
  build-platform:
    name: Build Docker image for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Ansible Lint
        run: |
          pip install ansible-lint
          ansible-lint

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          VERSION="$RELEASE_TAG"
          ARCH=$(printf '%s\n' "$PLATFORM" | sed 's|/|-|g')
          BUILD_TAG="ghcr.io/${{ github.repository }}:${VERSION}-${ARCH}"
          printf '%s\n' "version=${VERSION}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.version.outputs.build_tag }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

  merge-manifests:
    name: Merge manifests
    runs-on: ubuntu-latest
    needs: build-platform
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          printf '%s\n' "version=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Merge version manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_PATH: ${{ github.repository }}
          REPO_ENV: ${{ env.REPO }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${REPO_PATH}:${VERSION}" \
            -t "penguincloud/${REPO_ENV}:${VERSION}" \
            "ghcr.io/${REPO_PATH}:${VERSION}-amd64" \
            "ghcr.io/${REPO_PATH}:${VERSION}-arm64"

      - name: Merge latest manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_PATH: ${{ github.repository }}
          REPO_ENV: ${{ env.REPO }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${REPO_PATH}:latest" \
            -t "penguincloud/${REPO_ENV}:latest" \
            "ghcr.io/${REPO_PATH}:${VERSION}-amd64" \
            "ghcr.io/${REPO_PATH}:${VERSION}-arm64"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
