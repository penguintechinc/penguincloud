    RelationshipSpec:
      description: A parent/child edge between two resource kinds in this manifest.
      properties:
        child_kind:
          title: Child Kind
          type: string
        parent_field:
          title: Parent Field
          type: string
      required:
        - child_kind
        - parent_field
      title: RelationshipSpec
      type: object
    ResourceDescriptor:
      description: 'One resource kind: its shape, its columns, and how it is reached.


        ``transport`` governs the TYPED-MUTATION surface (create/delete, and

        whether an operation-starting action is reachable), never reads. Every

        read in this schema version — list AND detail — goes through the byte

        proxy; that is the only read path this codebase has (see

        ``app/resources_api.py``''s module docstring: "Reads are not here").

        ``transport == "proxy"`` means "no typed mutation backing": this schema

        version declares no mechanism for a proxy-transport resource to carry a

        typed create/delete, or an action whose result the portal must

        interpret (``starts_operations=True``) — both enforced below. A

        proxy-transport resource MAY still declare a plain action reachable

        through the ordinary allowlisted proxy POST (Gough''s own

        ``evacuate``/``reject``/``suspend``/``resume`` all qualify).


        ``list`` is ``None`` for a resource with no collection endpoint at all

        (Gough''s ``clusters`` — see ``adapters/gough/manifest.py`` for why it is

        NOT expressed as a ``ResourceDescriptor`` in this step; a schema finding,

        not a workaround). A resource descriptor that DOES declare ``list`` is

        assumed reachable at ``{list.path_bytes}{id}`` by nothing in THIS

        module — that derivation is deliberately not attempted here; see the

        same docstring.'
      properties:
        actions:
          default: []
          items:
            $ref: '#/components/schemas/ActionSpec'
          maxItems: 10000
          title: Actions
          type: array
        columns:
          items:
            $ref: '#/components/schemas/ColumnSpec'
          maxItems: 10000
          title: Columns
          type: array
        create:
          anyOf:
            - $ref: '#/components/schemas/FormSpec'
            - type: 'null'
        delete:
          anyOf:
            - $ref: '#/components/schemas/DeleteSpec'
            - type: 'null'
        detail:
          $ref: '#/components/schemas/DetailSpec'
        empty_state:
          title: Empty State
          type: string
        error_state:
          title: Error State
          type: string
        id_field:
          title: Id Field
          type: string
        kind:
          title: Kind
          type: string
        label:
          title: Label
          type: string
        list:
          anyOf:
            - $ref: '#/components/schemas/ListSpec'
            - type: 'null'
        name_field:
          title: Name Field
          type: string
        plural_label:
          title: Plural Label
          type: string
        relationships:
          default: []
          items:
            $ref: '#/components/schemas/RelationshipSpec'
          maxItems: 10000
          title: Relationships
          type: array
        transport:
          title: Transport
          type: string
      required:
        - kind
        - label
        - plural_label
        - id_field
        - name_field
        - transport
        - columns
        - empty_state
        - error_state
      title: ResourceDescriptor
      type: object
    RollupEntry:
      description: Per-tenant rollup row.
      properties:
        products:
          items:
            $ref: '#/components/schemas/RollupProduct'
          maxItems: 10000
          title: Products
          type: array
        tenant_id:
          title: Tenant Id
          type: integer
        tenant_name:
          title: Tenant Name
          type: string
      required:
        - tenant_id
        - tenant_name
        - products
      title: RollupEntry
      type: object
    RollupProduct:
      description: One product connection's status inside a rollup row.
      properties:
        connection_id:
          title: Connection Id
          type: integer
        product:
          title: Product
          type: string
        status:
          title: Status
          type: string
      required:
        - connection_id
        - product
        - status
      title: RollupProduct
      type: object
    TenantDetail:
      description: The projection a member (or delegated admin) may see.
      properties:
        depth:
          title: Depth
          type: integer
        display_name:
          title: Display Name
          type: string
        id:
          title: Id
          type: integer
        kind:
          title: Kind
          type: string
        max_products:
          title: Max Products
          type: integer
        max_users:
          title: Max Users
          type: integer
        name:
          title: Name
          type: string
        owner_id:
          title: Owner Id
          type: integer
        parent_tenant_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Parent Tenant Id
        plan:
          title: Plan
          type: string
        slug:
          title: Slug
          type: string
        status:
          title: Status
          type: string
        user_role:
          anyOf:
            - type: string
            - type: 'null'
          title: User Role
      required:
        - id
        - name
        - slug
        - display_name
        - kind
        - status
        - plan
        - parent_tenant_id
        - depth
        - owner_id
        - max_users
        - max_products
        - user_role
      title: TenantDetail
      type: object
    TenantMemberResponse:
      description: 'A tenant membership row plus the member''s contact identity.


        PII policy (deliberate, not incidental): ``user_email`` and

        ``user_full_name`` ARE included, because administering a tenant means

        administering its member accounts and an MSP admin cannot do that

        against opaque user ids. NO other column from the users table is

        exposed here — not role, not is_active, not timestamps, not

        password_hash — and this DTO is the only path membership data takes to a

        response body. Adding a column to `users` must not widen this.


        Field set is reconciled with the webui''s TenantMember interface

        (services/webui/src/client/types/index.ts).'
      properties:
        id:
          title: Id
          type: integer
        invited_by_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Invited By Id
        joined_at:
          anyOf:
            - type: string
            - type: 'null'
          title: Joined At
        role:
          title: Role
          type: string
        tenant_id:
          title: Tenant Id
          type: integer
        user_email:
          anyOf:
            - type: string
            - type: 'null'
          title: User Email
        user_full_name:
          anyOf:
            - type: string
            - type: 'null'
          title: User Full Name
        user_id:
          title: User Id
          type: integer
      required:
        - id
        - tenant_id
        - user_id
        - role
        - invited_by_id
        - joined_at
        - user_email
        - user_full_name
      title: TenantMemberResponse
      type: object
    TenantSummary:
      description: "The active tenant, as the dashboard overview names it.\n\nAttributes:\n\
        \    id: Identifier of the tenant.\n    name: Display name.\n    plan: Licensed plan\
        \ tier for this tenant."
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        plan:
          title: Plan
          type: string
      required:
        - id
        - name
        - plan
      title: TenantSummary
      type: object
    UserSummary:
      description: "One user row, as the admin listing publishes it.\n\nNever carries ``password_hash``\
        \ — the route pops it before this DTO is\nbuilt. Nothing else on the users table is\
        \ sensitive today, but pinning\nthe field set means a column added tomorrow (an MFA\
        \ secret, an SSO\nsubject id) does not reach this response without a deliberate edit\n\
        here.\n\nAttributes:\n    id: Identifier of the user.\n    email: The user's email address.\n\
        \    full_name: Display name.\n    role: Global role: admin, maintainer or viewer.\n\
        \    is_active: Whether the account can currently authenticate.\n    created_at: When\
        \ the account was created, ISO-8601.\n    updated_at: When the account was last modified,\
        \ ISO-8601."
      properties:
        created_at:
          anyOf:
            - type: string
            - type: 'null'
          title: Created At
        email:
          title: Email
          type: string
        full_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Full Name
        id:
          title: Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        role:
          title: Role
          type: string
        updated_at:
          anyOf:
            - type: string
            - type: 'null'
          title: Updated At
      required:
        - id
        - email
        - full_name
        - role
        - is_active
        - created_at
        - updated_at
      title: UserSummary
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: PenguinCloud Portal API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/audit/export:
    get:
      description: ''
      operationId: get_export_audit_logs
      parameters: []
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Export audit logs as CSV or JSON.
  /api/v1/audit/logs:
    get:
      description: ''
      operationId: get_get_audit_logs
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: "Envelope for GET /api/v1/audit/logs.\n\nAttributes:\n    logs:\
                  \ The matching audit entries, newest first.\n    total: Total matching rows\
                  \ across every page.\n    page: The page returned.\n    per_page: Page size\
                  \ used.\n    pages: Total number of pages."
                properties:
                  logs:
                    items:
                      $ref: '#/components/schemas/AuditRecord'
                    maxItems: 10000
                    title: Logs
                    type: array
                  page:
                    title: Page
                    type: integer
                  pages:
                    title: Pages
                    type: integer
                  per_page:
                    title: Per Page
                    type: integer
                  total:
                    title: Total
                    type: integer
                required:
                  - logs
                  - total
                  - page
                  - per_page
                  - pages
                title: AuditLogsResponse
                type: object
          description: "Envelope for GET /api/v1/audit/logs.\n\nAttributes:\n    logs: The matching\
            \ audit entries, newest first.\n    total: Total matching rows across every page.\n\
            \    page: The page returned.\n    per_page: Page size used.\n    pages: Total number\
            \ of pages."
      summary: Get audit logs with filtering and pagination.
  /api/v1/auth/confirm-email/{token}:
    post:
      description: '

        Both helpers are async coroutines; awaiting them directly (rather than

        scheduling them on an executor, which would just hand back an

        un-awaited coroutine object) is what actually runs the DB work.'
      operationId: post_confirm_email_endpoint
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Confirm a user's email address with a confirmation token.
  /api/v1/auth/forgot-password:
    post:
      description: '

        Unauthenticated. Always answers with :data:`PASSWORD_RESET_ACK` and 200,

        whether or not the address is registered, and never returns the reset

        token itself.


        Both properties are load-bearing security controls, not cosmetics:

        returning the token handed any anonymous caller a full account takeover

        for any address they could name, and returning a distinct message for

        the not-found case made the endpoint a user-enumeration oracle. Any

        change here that reintroduces a branch-dependent body reintroduces one

        of those two bugs.'
      operationId: post_forgot_password
      parameters: []
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Request a password reset link.
  /api/v1/auth/login:
    post:
      description: ''
      operationId: post_login
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: "Envelope for POST /api/v1/auth/login.\n\nNo ``id_token``: id tokens\
                  \ are OIDC \"who is this\" material, not bearer\ncredentials — TestTokenTypeConfusion\
                  \ (tests/api/test_auth.py) requires\npenguin-aaa's id token to be REFUSED\
                  \ on every protected route, so\nreturning one alongside the access token here\
                  \ would hand the client a\nvalue it is equally likely to just replay as a\
                  \ bearer.\n\nAttributes:\n    access_token: Bearer token for subsequent requests.\n\
                  \    refresh_token: Opaque token to exchange for a new pair via\n        /api/v1/auth/refresh.\n\
                  \    token_type: Always \"Bearer\".\n    expires_in: Seconds until access_token\
                  \ expires.\n    user: The authenticated caller's profile."
                properties:
                  access_token:
                    title: Access Token
                    type: string
                  expires_in:
                    title: Expires In
                    type: integer
                  refresh_token:
                    title: Refresh Token
                    type: string
                  token_type:
                    title: Token Type
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthenticatedUser'
                required:
                  - access_token
                  - refresh_token
                  - token_type
                  - expires_in
                  - user
                title: LoginResponse
                type: object
          description: "Envelope for POST /api/v1/auth/login.\n\nNo ``id_token``: id tokens\
            \ are OIDC \"who is this\" material, not bearer\ncredentials — TestTokenTypeConfusion\
            \ (tests/api/test_auth.py) requires\npenguin-aaa's id token to be REFUSED on every\
            \ protected route, so\nreturning one alongside the access token here would hand\
            \ the client a\nvalue it is equally likely to just replay as a bearer.\n\nAttributes:\n\
            \    access_token: Bearer token for subsequent requests.\n    refresh_token: Opaque\
            \ token to exchange for a new pair via\n        /api/v1/auth/refresh.\n    token_type:\
            \ Always \"Bearer\".\n    expires_in: Seconds until access_token expires.\n    user:\
            \ The authenticated caller's profile."
      summary: Login endpoint - returns access and refresh tokens.
  /api/v1/auth/logout:
    post:
      description: ''
      operationId: post_logout
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: "Envelope for POST /api/v1/auth/logout.\n\nAttributes:\n    message:\
                  \ Human-readable confirmation.\n    tokens_revoked: Number of the caller's\
                  \ refresh tokens revoked."
                properties:
                  message:
                    title: Message
                    type: string
                  tokens_revoked:
                    title: Tokens Revoked
                    type: integer
                required:
                  - message
                  - tokens_revoked
                title: LogoutResponse
                type: object
          description: "Envelope for POST /api/v1/auth/logout.\n\nAttributes:\n    message:\
            \ Human-readable confirmation.\n    tokens_revoked: Number of the caller's refresh\
            \ tokens revoked."
      summary: Logout endpoint - revokes all refresh tokens for user.
  /api/v1/auth/me:
    get:
      description: ''
      operationId: get_get_me
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: "Envelope for GET /api/v1/auth/me.\n\nWider than :class:`AuthenticatedUser`\
                  \ (adds ``is_active`` and\n``created_at``) because this route's whole purpose\
                  \ is the caller's own\nprofile — the same reasoning that keeps LoginResponse's\
                  \ embedded user\nnarrow applies in reverse here: this IS the profile view.\
                  \ Never\n``password_hash``, MFA secret, or any other row internal.\n\nAttributes:\n\
                  \    id: Identifier of the authenticated user.\n    email: The user's email\
                  \ address.\n    full_name: Display name.\n    role: Global role: admin, maintainer\
                  \ or viewer.\n    is_active: Whether the account can currently authenticate.\n\
                  \    created_at: When the account was created, ISO-8601."
                properties:
                  created_at:
                    anyOf:
                      - type: string
                      - type: 'null'
                    title: Created At
                  email:
                    title: Email
                    type: string
                  full_name:
                    title: Full Name
                    type: string
                  id:
                    title: Id
                    type: integer
                  is_active:
                    title: Is Active
                    type: boolean
                  role:
                    title: Role
                    type: string
                required:
                  - id
                  - email
                  - full_name
                  - role
                  - is_active
                  - created_at
                title: MeResponse
                type: object
          description: "Envelope for GET /api/v1/auth/me.\n\nWider than :class:`AuthenticatedUser`\
            \ (adds ``is_active`` and\n``created_at``) because this route's whole purpose is\
            \ the caller's own\nprofile — the same reasoning that keeps LoginResponse's embedded\
            \ user\nnarrow applies in reverse here: this IS the profile view. Never\n``password_hash``,\
            \ MFA secret, or any other row internal.\n\nAttributes:\n    id: Identifier of the\
            \ authenticated user.\n    email: The user's email address.\n    full_name: Display\
            \ name.\n    role: Global role: admin, maintainer or viewer.\n    is_active: Whether\
            \ the account can currently authenticate.\n    created_at: When the account was\
            \ created, ISO-8601."
      summary: Get current user profile.
  /api/v1/auth/oauth/connections:
    get:
      description: ''
      operationId: get_get_oauth_connections
      parameters: []
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Get OAuth connections for current user.
  /api/v1/auth/oauth/{provider}:
    get:
      description: ''
      operationId: get_oauth_redirect
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Redirect to OAuth provider for authorization.
  /api/v1/auth/oauth/{provider}/callback:
    get:
      description: ''
      operationId: get_oauth_callback
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Handle OAuth2 callback and create/link user account.
  /api/v1/auth/oauth/{provider}/disconnect:
    post:
      description: ''
      operationId: post_disconnect_oauth
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Disconnect OAuth connection for current user.
  /api/v1/auth/refresh:
    post:
      description: '

        Rotation is one-use: the presented token is revoked before its

        replacement is issued, so replaying it afterwards fails even if

        issuance errors partway through.'
      operationId: post_refresh
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: "Envelope for POST /api/v1/auth/refresh.\n\nNo ``user``: a refresh\
                  \ proves possession of a still-valid refresh\ntoken, not a fresh credential\
                  \ check, so re-stating the profile here\nwould imply a re-authentication this\
                  \ endpoint does not perform. Callers\nthat need the current profile call GET\
                  \ /api/v1/auth/me.\n\nAttributes:\n    access_token: Newly issued bearer token.\n\
                  \    refresh_token: Newly issued refresh token — the presented one was\n \
                  \       revoked as part of rotation and is no longer valid.\n    token_type:\
                  \ Always \"Bearer\".\n    expires_in: Seconds until access_token expires."
                properties:
                  access_token:
                    title: Access Token
                    type: string
                  expires_in:
                    title: Expires In
                    type: integer
                  refresh_token:
                    title: Refresh Token
                    type: string
                  token_type:
                    title: Token Type
                    type: string
                required:
                  - access_token
                  - refresh_token
                  - token_type
                  - expires_in
                title: RefreshResponse
                type: object
          description: "Envelope for POST /api/v1/auth/refresh.\n\nNo ``user``: a refresh proves\
            \ possession of a still-valid refresh\ntoken, not a fresh credential check, so re-stating\
            \ the profile here\nwould imply a re-authentication this endpoint does not perform.\
            \ Callers\nthat need the current profile call GET /api/v1/auth/me.\n\nAttributes:\n\
            \    access_token: Newly issued bearer token.\n    refresh_token: Newly issued refresh\
            \ token — the presented one was\n        revoked as part of rotation and is no longer\
            \ valid.\n    token_type: Always \"Bearer\".\n    expires_in: Seconds until access_token\
            \ expires."
      summary: Exchange a refresh token for a new token pair, rotating the old one.
  /api/v1/auth/register:
    post:
      description: '

        Closed by default (Config.ALLOW_SELF_REGISTRATION) — checked before

        anything else runs, including request-body validation, so a closed

        deployment never even parses an anonymous caller''s payload.'
      operationId: post_register
      parameters: []
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Register new user (creates viewer role by default + personal team).
  /api/v1/auth/reset-password:
    post:
      description: ''
      operationId: post_reset_password
      parameters: []
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Reset password with token.
  /api/v1/auth/sessions:
    get:
      description: ''
      operationId: get_list_sessions
      parameters: []
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: List active sessions for the authenticated user.
  /api/v1/auth/sessions/{session_id}:
    delete:
      description: ''
      operationId: delete_revoke_session_endpoint
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: number
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Revoke one of the authenticated user's sessions.
  /api/v1/console/manifests:
    get:
      description: '

        Pruned by (in order): flag, membership+per-product-scope+licence+

        deactivation (all via :func:`resolve_product_context`), and finally the

        subtract-only ``capabilities()`` overlay. See the module docstring for

        why there is no separate top-level membership check.'
      operationId: get_list_console_manifests
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Envelope for ``GET /api/v1/console/manifests``.
                properties:
                  count:
                    title: Count
                    type: integer
                  manifests:
                    items:
                      $ref: '#/components/schemas/ProductManifestEntry'
                    maxItems: 10000
                    title: Manifests
                    type: array
                required:
                  - manifests
                  - count
                title: ConsoleManifestsResponse
                type: object
          description: Envelope for ``GET /api/v1/console/manifests``.
      summary: Every product this tenant is connected to that has a committed manifest.
  /api/v1/dashboard/activity:
    get:
      description: ''
      operationId: get_dashboard_activity
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: "Recent audit events for one tenant, newest first.\n\nAttributes:\n\
                  \    activity: The audit entries.\n    count: Number of entries returned."
                properties:
                  activity:
                    items:
                      $ref: '#/components/schemas/AuditRecord'
                    maxItems: 10000
                    title: Activity
                    type: array
                  count:
                    title: Count
                    type: integer
                required:
                  - activity
                  - count
                title: ActivityResponse
                type: object
          description: "Recent audit events for one tenant, newest first.\n\nAttributes:\n \
            \   activity: The audit entries.\n    count: Number of entries returned."
      summary: Recent audit events for the tenant.
  /api/v1/dashboard/alerts:
    get:
      description: ''
      operationId: get_dashboard_alerts
      parameters: []
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
