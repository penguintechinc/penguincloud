  /api/v1/tenants/{tenant_id}/parent:
    put:
      description: '

        Requires admin authority in BOTH the tenant being moved and the

        destination parent — moving a subtree under a parent you administer is

        a grant of authority over that subtree, so authority over only one side

        is not enough. Rejects cycles, maintains ``depth`` for the whole moved

        subtree, and invalidates caches on both the old and new ancestor chains.'
      operationId: put_reparent_tenant_endpoint
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: number
      requestBody:
        content:
          application/json:
            schema:
              description: Request body for moving a tenant within the hierarchy.
              properties:
                parent_tenant_id:
                  anyOf:
                    - type: integer
                    - type: 'null'
                  title: Parent Tenant Id
              title: ReparentRequest
              type: object
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no
            @validate_response annotation, so no schema is published for it; do not rely on
            a specific body until one is.
      summary: Move a tenant (and its subtree) under a new parent, or to a root.
  /api/v1/tenants/{tenant_id}/switch:
    post:
      description: '

        Allowed if the caller is a direct member of the tenant, or holds

        admin/owner in one of its ancestors (delegated MSP admin).


        Authorization runs BEFORE the existence/active check on purpose. The

        other order answers "does tenant 4127 exist?" for any authenticated

        user, because a non-existent tenant 404s while a real one they cannot

        reach 403s. Now every unauthorized caller sees the same 403 regardless.'
      operationId: post_switch_tenant
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'Token re-issue result for a tenant switch.


                  ``tenant`` is a full TenantDetail, not a TenantSummary. The caller has

                  just been authorized into this tenant, so they are entitled to exactly

                  what GET /tenants/<id> would hand them — and the webui populates its

                  entire ``currentTenant`` from this one object (tenantStore.ts), so a

                  summary here starves every consumer that reads it. LicenseGate.tsx falls

                  back to "free" on a missing ``plan``, which silently hides every licensed

                  feature from every user rather than failing visibly.'
                properties:
                  access_token:
                    title: Access Token
                    type: string
                  scope:
                    items:
                      type: string
                    maxItems: 10000
                    title: Scope
                    type: array
                  tenant:
                    $ref: '#/components/schemas/TenantDetail'
                  tenant_role:
                    title: Tenant Role
                    type: string
                required:
                  - access_token
                  - tenant
                  - tenant_role
                  - scope
                title: TenantSwitchResponse
                type: object
          description: 'Token re-issue result for a tenant switch.


            ``tenant`` is a full TenantDetail, not a TenantSummary. The caller has

            just been authorized into this tenant, so they are entitled to exactly

            what GET /tenants/<id> would hand them — and the webui populates its

            entire ``currentTenant`` from this one object (tenantStore.ts), so a

            summary here starves every consumer that reads it. LicenseGate.tsx falls

            back to "free" on a missing ``plan``, which silently hides every licensed

            feature from every user rather than failing visibly.'
      summary: Switch active tenant — returns a new JWT scoped to it.
