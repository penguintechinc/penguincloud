# ==========================================================================
# DEPRECATED: Docker Compose support has been deprecated.
# Kubernetes (microk8s) with Helm v3 is now the standard deployment method.
#
# Use instead:
#   Alpha:  make k8s-alpha-deploy
#   Beta:   make k8s-beta-deploy
#   Prod:   make k8s-prod-deploy
#
# See k8s/helm/project-template/ for Helm charts and values files.
# This file is retained for reference only and will be removed in a future release.
# ==========================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-bookworm@sha256:7858a1a43bb2e3decc07650c8989ba526e0a8164f212c9bb88b622cdbd71c4be
    container_name: project-template-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      # Same reasoning as SECRET_KEY below: "password" is published in this
      # file's own history/diff, so a fallback here is indistinguishable
      # from no password at all. Required, not defaulted.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Redis Cache
  redis:
    image: redis:7-bookworm@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
    container_name: project-template-redis
    # No insecure fallback -- same reasoning as POSTGRES_PASSWORD above.
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env} --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Flask Backend (Standard APIs, Auth, Teams)
  portal-api:
    build:
      context: ./services/portal-api
      dockerfile: Dockerfile
    container_name: project-template-teams-api
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      # No insecure fallback: portal-api's create_app() now refuses to
      # start (outside TESTING) while SECRET_KEY is unset -- Quart signs
      # the session cookie, including the OAuth CSRF state, with this key,
      # so a known default is as forgeable as no signature at all. Set a
      # real value in your .env (docs/DEVELOPMENT.md).
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your .env -- see docs/DEVELOPMENT.md}
      # Declared, not left to default+undeclared: app/__init__.py's JWT
      # keystore guard refuses to start when NEITHER JWT_KEYSTORE_PATH nor
      # an explicit replica/worker count is declared (round-1 I1). This
      # really is one compose container, one hypercorn worker (see
      # HYPERCORN_WORKERS on the Dockerfile CMD line), so both are stated
      # as 1 rather than relying on Config's default to happen to agree.
      - DEPLOYMENT_REPLICAS=${DEPLOYMENT_REPLICAS:-1}
      - HYPERCORN_WORKERS=${HYPERCORN_WORKERS:-1}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-app_db}
      - DB_USER=${POSTGRES_USER:-app_user}
      - DB_PASS=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env}@redis:6379/0
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      # "admin123" is a published, guessable default for the account this
      # provisions as an actual admin -- same class of defect as SECRET_KEY,
      # required rather than defaulted for the same reason.
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD in your .env}
      - GRPC_ENABLED=${GRPC_ENABLED:-true}
      - GRPC_PORT=50051
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - DISCOVERY_RANGES=${DISCOVERY_RANGES:-}
    ports:
      - "${FLASK_PORT:-5000}:5000"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # WebUI (Node.js + React Frontend Shell)
  webui:
    build:
      context: .
      dockerfile: ./services/webui/Dockerfile
    container_name: project-template-webui
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - FLASK_API_URL=http://portal-api:5000
    ports:
      - "${WEBUI_PORT:-3000}:3000"
    depends_on:
      - portal-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  # Mobile App (Flutter)
  # The mobile app runs on device/emulator, not as a Docker service.
  # Build with: cd services/mobile && flutter run
  # See services/mobile/README.md for setup instructions.

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    container_name: project-template-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - app-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:12.4.2@sha256:83749231c3835e390a3144e5e940203e42b9589761f20ef3169c716e734ad505
    container_name: project-template-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      # Same class of defect as SECRET_KEY/DEFAULT_ADMIN_PASSWORD above.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in your .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - app-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional - for production)
  nginx:
    image: nginx:stable-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    container_name: project-template-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/docker/nginx/conf.d:/etc/nginx/conf.d
      - ./infrastructure/docker/nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - portal-api
      - webui
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  app-network:
    driver: bridge
