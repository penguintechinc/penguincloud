      description: "\nQuery params:\n  - include_children=true: also list tenants in subtrees the caller\n    administers.\
        \ Those rows come back as TenantSummary, not\n    TenantDetail: holding admin over an ancestor grants the right to\n\
        \    know a descendant exists, not to read its plan, quotas or owner\n    without switching into it."
      operationId: get_list_user_tenants
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Envelope for tenant listings; rows are mixed detail/summary.
                properties:
                  count:
                    title: Count
                    type: integer
                  tenants:
                    items:
                      additionalProperties: true
                      type: object
                    maxItems: 10000
                    title: Tenants
                    type: array
                required:
                  - tenants
                  - count
                title: TenantListResponse
                type: object
          description: Envelope for tenant listings; rows are mixed detail/summary.
      summary: List user's tenants (with optional subtree expansion).
    post:
      description: '

        ``parent_tenant_id`` is what makes a hierarchy constructible at all: with

        no way to set it at creation, every tenant is a root and the delegated

        admin model has nothing to delegate over. The parent is validated for

        existence, caller authority, and depth before any row is written.'
      operationId: post_create_tenant_endpoint
      parameters: []
      responses:
        default:
          description: Response shape is not yet declared for this operation. The view has no @validate_response annotation,
            so no schema is published for it; do not rely on a specific body until one is.
      summary: Create new tenant, optionally beneath an existing parent tenant.
  /api/v1/tenants/{tenant_id}:
    delete:
      description: '

        Stays strictly owner-gated at both layers. ``tenants:delete`` appears in

        the owner bundle alone — notably NOT in the delegated-admin bundle,

        which is what keeps delegation conferring management rather than

        destruction of a tenant somebody else owns. The ownership check below

        is retained on top: the scope answers "an owner of this tenant", the

        row check answers "*the* owner", and only the second is authoritative

        for an irreversible delete.'
      operationId: delete_delete_tenant_endpoint
      parameters:
        - in: path
          name: tenant_id
