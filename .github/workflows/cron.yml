# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image on Cron Job

permissions:
  contents: read

on:
  schedule:
    - cron: 1 1 * * 1

concurrency:
  group: publish-cron
  cancel-in-progress: false

jobs:
  # See push.yml prepare job for why the epoch is resolved once and shared
  # -- the previous version computed a fresh `date +%s` independently in
  # build-platform AND merge-manifests, so the merge step referenced tags
  # that build-platform never actually pushed.
  prepare:
    name: Resolve build tag
    runs-on: ubuntu-latest
    outputs:
      epoch: ${{ steps.vars.outputs.epoch }}
    steps:
      - name: Resolve epoch
        id: vars
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  build-platform:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        service: [portal-api, webui]
        include:
          - service: portal-api
            context: services/portal-api
            dockerfile: services/portal-api/Dockerfile
          - service: webui
            context: .
            dockerfile: services/webui/Dockerfile
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build tag
        id: tag
        env:
          PLATFORM: ${{ matrix.platform }}
          SERVICE: ${{ matrix.service }}
          EPOCH: ${{ needs.prepare.outputs.epoch }}
        run: |
          ARCH=$(printf '%s\n' "$PLATFORM" | sed 's|/|-|g')
          IMAGE="ghcr.io/${{ github.repository }}/${SERVICE}"
          BUILD_TAG="${IMAGE}:gamma-${EPOCH}-${ARCH}"
          printf '%s\n' "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.tag.outputs.build_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }},mode=max

  merge-manifests:
    name: Merge manifests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [prepare, build-platform]
    strategy:
      matrix:
        service: [portal-api, webui]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge manifests (gamma + nightly tags)
        env:
          SERVICE: ${{ matrix.service }}
          EPOCH: ${{ needs.prepare.outputs.epoch }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/${SERVICE}"
          docker buildx imagetools create \
            -t "${IMAGE}:gamma-${EPOCH}" \
            -t "${IMAGE}:nightly" \
            "${IMAGE}:gamma-${EPOCH}-amd64" \
            "${IMAGE}:gamma-${EPOCH}-arm64"
