          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  deleted:
                    default: true
                    title: Deleted
                    type: boolean
                  id:
                    title: Id
                    type: string
                  kind:
                    title: Kind
                    type: string
                required:
                  - kind
                  - id
                title: ResourceDeletedResponse
                type: object
          description: 'Acknowledgement that a resource was deleted.


            A body rather than a bare ``204`` because the deletion may be the start of

            teardown rather than the end of it, and the UI needs somewhere to read that

            from. ``kind`` and ``id`` are echoed so a client handling several deletions

            can attribute the answer without tracking request order.'
      summary: Delete one resource from the connected product.
  /api/v1/products/{product_id}/resources/{kind}/{resource_id}/actions/{action}:
    post:
      description: '

        This is the TYPED path for actions, and it exists because the proxy

        cannot serve this case. Proxying ``POST /nodes/{id}/deploy`` forwards

        Gough''s raw ``202`` body to the browser, which leaves the UI holding a

        product-specific payload with no :class:`ActionResult`, no normalised

        state, and no poll key — so it can only invalidate its queries and hope

        the deploy it just started eventually shows up somewhere.


        Going through :meth:`Adapter.perform_action` instead means the response

        carries the deployment ids as :class:`OperationView` objects, each already

        addressable at ``/operations/{kind}/{id}``. The UI learns exactly what it

        started. See "Which mutations go through which path" in

        :mod:`app.adapters.base`.


        Requires ``manage``: every action reaching here changes product state.

        ``kind`` and ``action`` are validated by the adapter against literal

        tables before any URL is built — neither is interpolated into a path here.'
      operationId: post_perform_resource_action
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: number
        - in: path
          name: kind
          required: true
          schema:
            type: string
        - in: path
          name: resource_id
          required: true
          schema:
            type: string
        - in: path
          name: action
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  accepted:
                    title: Accepted
                    type: boolean
                  action:
                    title: Action
                    type: string
                  message:
                    anyOf:
                      - type: string
                      - type: 'null'
                    title: Message
                  operations:
                    items:
                      $ref: '#/components/schemas/OperationView'
                    maxItems: 10000
                    title: Operations
                    type: array
                  resource:
                    anyOf:
                      - $ref: '#/components/schemas/ActionResourceView'
                      - type: 'null'
                required:
                  - action
                  - accepted
                  - operations
                  - resource
                  - message
                title: ActionResultResponse
                type: object
          description: 'Outcome of a product action, including anything left to poll.


            ``operations`` is the field this route exists for. It is a LIST because a

            single Gough node deploy returns one deployment per assigned biome, and a

            caller handed only the first would poll a fraction of the work it started.

            An empty list means the action completed synchronously — which is how the

            UI tells "nothing to poll" from "poll these".'
      summary: Invoke a product action and return the operations it started.
